# ARMS behind nginx, with TLS.
#
# The backend speaks plain HTTP and has no TLS of its own. It must not be
# exposed directly: sessions are cookies, and a cookie sent over plain HTTP on
# a public network is a password sent over plain HTTP on a public network.
#
#   1. certbot --nginx -d arms.example.co.za
#   2. In the backend .env:  PUBLIC_URL=https://arms.example.co.za
#                            SECURE_COOKIES=true
#                            TRUST_PROXY=true
#                            HOST=127.0.0.1
#   3. systemctl reload nginx
#
# TRUST_PROXY=true is what makes the backend believe X-Forwarded-For, so the
# audit trail records the caller rather than the proxy. Leave it OFF when there
# is no proxy: unproxied, that header is written by the caller, and believing it
# would let anyone write any address into a national animal-health audit log.

server {
    listen 80;
    server_name arms.example.co.za;
    # Everything goes to TLS. Certbot rewrites this block when it issues.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name arms.example.co.za;

    ssl_certificate     /etc/letsencrypt/live/arms.example.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arms.example.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # This is government-facing animal-health data on a system with no MFA yet.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "same-origin" always;

    # The explorer is a 2,4 MB page because eleven years of figures are inlined.
    # Compressed it is a fraction of that, and abattoir offices are not on fibre.
    gzip on;
    gzip_types text/html application/json application/javascript text/css;
    gzip_min_length 1024;

    # That same page is why the body and timeouts are generous. Nothing here
    # streams; a request either answers in a few seconds or something is wrong.
    client_max_body_size 8m;
    proxy_read_timeout   120s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/health is the one route with no session. Useful for a load balancer,
    # and it exposes no figures - but it does name the databases, so keep it
    # off the public internet if you can.
    location = /api/health {
        # allow 10.0.0.0/8; deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }
}
